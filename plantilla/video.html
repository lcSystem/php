<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video 9:16 con Zoom Controlado</title>
<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #000;
  height: 100vh;
}

.video-container {
  width: 90%;
  max-width: 540px;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: center center;
  transition: transform 0.2s ease;
}

.zoom-control {
  margin-top: 10px;
  width: 90%;
  max-width: 540px;
}
</style>
</head>
<body>

<div class="video-container">
  <video id="video" src="video.mp4" controls></video>
</div>

<div class="zoom-control">
  <label>Zoom: <input type="range" id="zoom" min="1" max="2" step="0.01" value="1"></label>
</div>

<script>
const video = document.getElementById("video");
const zoom = document.getElementById("zoom");

const ZOOM_FINAL = 0.8; // últimos 6s
const ZOOM_NORMAL = 1;   // inicio y tiempo central

video.addEventListener("loadedmetadata", () => {

  video.addEventListener("timeupdate", () => {
    const t = video.currentTime;
    const dur = video.duration;
    let scale;

    if(t <= 6){
      scale = ZOOM_NORMAL; // primeros 6s normales
    } else if(t >= dur - 6){
      scale = ZOOM_FINAL; // últimos 6s reducidos
    } else {
      scale = parseFloat(zoom.value); // tiempo central, controlable con slider
    }

    video.style.transform = `scale(${scale})`;
  });

  // Slider de zoom solo afecta tiempo central
  zoom.addEventListener("input", () => {
    const t = video.currentTime;
    let scale;
    if(t <= 6){
      scale = ZOOM_NORMAL; // inicio no cambia
    } else if(t >= video.duration - 6){
      scale = ZOOM_FINAL; // fin no cambia
    } else {
      scale = parseFloat(zoom.value); // tiempo central
    }
    video.style.transform = `scale(${scale})`;
  });

});
</script>

</body>
</html>
