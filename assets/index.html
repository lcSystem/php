<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertas LCTECH</title>
<style>
  /* ==== Toast ==== */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
  }
  .toast {
    min-width: 250px;
    padding: 15px 20px;
    border-radius: 10px;
    color: #fff;
    font-family: Arial, sans-serif;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateX(120%);
    transition: all 0.5s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.success { background: linear-gradient(45deg,#28a745,#2ecc71); }
  .toast.error { background: linear-gradient(45deg,#dc3545,#e74c3c); }
  .toast.info { background: linear-gradient(45deg,#007bff,#3498db); }
  .toast.warning { background: linear-gradient(45deg,#ffc107,#f39c12); color:#333; }

  .toast .close-btn {
    position: absolute;
    top: 5px; right: 10px;
    font-weight: bold;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
  }
  .toast:hover .close-btn { color: #fff; }

  /* ==== Modal Confirmación ==== */
  .modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(2px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 9998;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #FFD700; /* Dorado suave */
    color: #222;
    padding: 25px 35px;
    border-radius: 15px;
    text-align: center;
    min-width: 320px;
    font-family: Arial, sans-serif;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transform: scale(0.7);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .modal.show .modal-content { transform: scale(1); }

  .modal-content button {
    margin: 12px;
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-accept { background: #28a745; color: #fff; }
  .btn-cancel { background: #dc3545; color: #fff; }
  .btn-accept:hover { background: #218838; transform: scale(1.05); }
  .btn-cancel:hover { background: #c82333; transform: scale(1.05); }
</style>
</head>
<body>
<h2>Alertas Mejoradas</h2>

<!-- Botones para probar las alertas -->
<button onclick="showToast('¡Éxito!', 'success')">Éxito</button>
<button onclick="showToast('Ocurrió un error.', 'error')">Error</button>
<button onclick="showToast('Aviso informativo.', 'info')">Info</button>
<button onclick="showToast('Cuidado con esta acción.', 'warning')">Warning</button>
<button onclick="showConfirmation('¿Deseas continuar?', onConfirm, onCancel)">Validación</button>

<!-- Contenedor Toast -->
<div class="toast-container" id="toast-container"></div>

<!-- Modal Confirmación -->
<div class="modal" id="modal">
  <div class="modal-content" id="modal-content">
    <p id="modal-message">Mensaje de confirmación</p>
    <button class="btn-accept" id="btn-accept">Aceptar</button>
    <button class="btn-cancel" id="btn-cancel">Cancelar</button>
  </div>
</div>

<script>
  /* ==== Toast ==== */
  function showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.classList.add('toast', type);
    toast.innerHTML = message + '<span class="close-btn">&times;</span>';
    container.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 100);

    // Cerrar al presionar la X
    toast.querySelector('.close-btn').addEventListener('click', () => {
      toast.classList.remove('show');
      setTimeout(() => container.removeChild(toast), 400);
    });

    // Cierre automático
    const timeout = setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => container.removeChild(toast), 400);
    }, duration);

    // Pausar al pasar el mouse
    toast.addEventListener('mouseenter', () => clearTimeout(timeout));
    toast.addEventListener('mouseleave', () => {
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => container.removeChild(toast), 400);
      }, duration/2);
    });
  }

  /* ==== Modal Confirmación ==== */
  const modal = document.getElementById('modal');
  const modalMessage = document.getElementById('modal-message');
  const btnAccept = document.getElementById('btn-accept');
  const btnCancel = document.getElementById('btn-cancel');

  function showConfirmation(message, onAccept, onCancel) {
    modalMessage.textContent = message;
    modal.classList.add('show');

    const acceptHandler = () => { modal.classList.remove('show'); onAccept(); cleanup(); };
    const cancelHandler = () => { modal.classList.remove('show'); onCancel(); cleanup(); };
    const cleanup = () => {
      btnAccept.removeEventListener('click', acceptHandler);
      btnCancel.removeEventListener('click', cancelHandler);
    };

    btnAccept.addEventListener('click', acceptHandler);
    btnCancel.addEventListener('click', cancelHandler);
  }

  function onConfirm() { showToast('Has aceptado la acción', 'success'); }
  function onCancel() { showToast('Has cancelado la acción', 'warning'); }
</script>
</body>
</html>
